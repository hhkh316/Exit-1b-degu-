<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>レーン個別管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:720px;margin:auto;padding:16px}
.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.head h1{margin:0;font-size:24px}.status,.card{background:#fff;border:1px solid #e0e5e9;border-radius:16px;padding:15px;margin:12px 0}.status{font-size:14px}
.banner{display:none;padding:13px;border-radius:12px;background:#fff4d6;border:1px solid #efc66b;font-weight:800;margin:12px 0}.toast{display:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#17202a;color:#fff;padding:12px 18px;border-radius:12px}
.group{border:1px solid #dce2e7;border-radius:14px;padding:14px}.stage{font-size:22px;font-weight:900}.timer{font-size:48px;font-weight:900;margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#1769e0;color:#fff}.danger{background:#d93025;color:#fff}.muted{background:#e9edf1;color:#17202a}.small{font-size:13px;color:#68737d}
input{padding:10px;border:1px solid #ccd3da;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
 <div class="head"><h1 id="title">🎪 レーン管理</h1><a id="otherLane" href="#">もう一方のレーン</a></div>
 <div id="status" class="status">Firebase接続中…</div>
 <div id="laneBanner" class="banner"></div>
 <div id="manualBanner" class="banner">⏸ タイマーが停止中です</div>

 <section class="card"><h2>現在のグループ</h2><div id="active"></div></section>
 <section class="card"><h2>次の待ち組</h2><div id="waiting"></div></section>
 <section class="card">
   <h2>このレーンへ直接追加</h2>
   <div class="row"><input id="name" placeholder="グループ名" style="flex:1;min-width:200px"><button class="primary" onclick="addToLane()">追加</button></div>
 </section>
</div>
<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyDxGXjcovsjKm5S2a-KicwYfCxplDzngk",
 authDomain:"exit1b.firebaseapp.com",
 databaseURL:"https://exit1b-default-rtdb.firebaseio.com",
 projectId:"exit1b",
 storageBucket:"exit1b.firebasestorage.app",
 messagingSenderId:"165232048524",
 appId:"1:165232048524:web:9e9817e8a2cb95e05ffea9"
};
firebase.initializeApp(firebaseConfig);const db=firebase.database(),groupsRef=db.ref("groups");
const lane=(new URLSearchParams(location.search).get("lane")||"A").toUpperCase()==="B"?"B":"A";
document.getElementById("title").textContent="🎪 レーン"+lane+" 管理";
document.getElementById("otherLane").href="?lane="+(lane==="A"?"B":"A");
document.getElementById("otherLane").textContent="レーン"+(lane==="A"?"B":"A")+"へ";
const sid="lane_"+lane+"_"+Date.now()+"_"+Math.random().toString(36).slice(2);
db.ref("presence/"+sid).set({page:"レーン"+lane+"管理",updatedAt:firebase.database.ServerValue.TIMESTAMP});db.ref("presence/"+sid).onDisconnect().remove();
let groups=[],control={globalLocked:false,lanes:{A:{paused:false},B:{paused:false}}};
function normalizeControl(v){v=v||{};return{globalLocked:v.globalLocked===true,lanes:{A:{paused:v.lanes?.A?.paused===true},B:{paused:v.lanes?.B?.paused===true}}}}
function normalize(v){if(!v)return[];if(Array.isArray(v))return v.filter(Boolean);return Object.entries(v).map(([id,g])=>({...g,id}))}
function isGroup(g){return g&&g.kind!=="waiting"&&g.name}
function getLimit(g){return Math.max(0,Number(g.limitMs||0))}
function rem(g,now=Date.now()){if(g.startAt)return Math.max(0,getLimit(g)-((now-g.startAt)+(g.elapsedBeforeStart||0)));return Math.max(0,Number(g.remainingMs??g.limitMs??0))}
function fmt(ms){ms=Math.max(0,Math.floor(ms/1000));return String(Math.floor(ms/60)).padStart(2,"0")+":"+String(ms%60).padStart(2,"0")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function laneGroups(){return groups.filter(g=>isGroup(g)&&g.lane===lane&&!g.finishedAt).sort((a,b)=>(a.order??a.createdAt??0)-(b.order??b.createdAt??0))}
function waiting(){return groups.filter(g=>g&&g.kind==="waiting"&&g.lane===lane).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
async function canOperate(){
 try{const s=await db.ref("control").once("value");control=normalizeControl(s.val());renderBanner();
  if(control.globalLocked){alert("🔒 全体ロック中です。状況モニターから解除してください。");return false}
  if(control.lanes[lane].paused){alert("⏸️ レーン"+lane+"は休止中です。状況モニターから再開してください。");return false}
  return true
 }catch(e){alert("🔴 ロック状態を確認できないため操作を中止しました。");return false}
}
function renderBanner(){
 const e=document.getElementById("laneBanner"),m=[];
 if(control.globalLocked)m.push("🔒 全体ロック中");
 if(control.lanes[lane].paused)m.push("⏸️ レーン"+lane+"は休止中");
 e.textContent=m.length?m.join("　")+"：状況モニターから操作できます。":"";e.style.display=m.length?"block":"none";
}
function show(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
function render(){
 renderBanner();
 const gs=laneGroups(),g=gs[0],man=document.getElementById("manualBanner");
 man.style.display=g?.pausedAt&&!g?.startAt&&!g?.pausedByLane?"block":"none";
 document.getElementById("active").innerHTML=g?activeCard(g):"<div class='small'>現在グループなし</div>";
 const w=waiting()[0];
 document.getElementById("waiting").innerHTML=w?`<div class="group"><b>${esc(w.name)}</b><p class="small">待ち順で次に案内されます。</p><button class="primary" onclick="advanceLane()">➡️ 次を案内</button></div>`:"<div class='small'>待ち組なし</div>";
}
function activeCard(g){
 const status=g.pausedByLane?"⏸ レーン休止中":g.pausedAt?"⏸ 停止中":g.startAt?"▶ 実行中":"⏹ 開始待ち";
 return `<div class="group"><b>${esc(g.name)}</b><div class="stage">ステージ ${Number(g.stage||1)}</div><div class="timer">${fmt(rem(g))}</div><div class="small">${status}</div>
 <div class="row" style="margin-top:10px">
 <button class="muted" onclick="act('${g.id}','minus')">−</button><button class="muted" onclick="act('${g.id}','plus')">＋</button>
 <button class="primary" onclick="act('${g.id}',${g.startAt?"'stop'":"'start'"})">${g.startAt?"停止":"開始"}</button>
 <button class="muted" onclick="act('${g.id}','resetStage')">ステージリセット</button><button class="muted" onclick="act('${g.id}','resetTimer')">タイマーリセット</button>
 <button class="muted" onclick="act('${g.id}','setLimit')">時間設定</button><button class="danger" onclick="act('${g.id}','delete')">削除</button>
 </div></div>`;
}
async function act(id,a){
 const g=groups.find(x=>x.id===id);if(!g||!(await canOperate()))return;
 const r=groupsRef.child(id),now=Date.now();
 if(a==="plus"||a==="minus")await r.update({stage:Math.max(1,Number(g.stage||1)+(a==="plus"?1:-1))});
 else if(a==="start")await r.update({startAt:now,remainingMs:rem(g,now),pausedAt:null,pausedByLane:null,resumedAt:now});
 else if(a==="stop"){if(!g.startAt)return;await r.update({remainingMs:rem(g,now),startAt:null,pausedAt:now})}
 else if(a==="resetStage")await r.update({stage:1,finishedAt:null,finishedStage:null});
 else if(a==="resetTimer")await r.update({remainingMs:getLimit(g)||600000,startAt:null,pausedAt:null,pausedByLane:null});
 else if(a==="setLimit"){const x=prompt("制限時間を分で入力",String(Math.round(getLimit(g)/60000)||10));if(x===null)return;const ms=Number(x)*60000;if(!Number.isFinite(ms)||ms<=0)return alert("正しい数字を入力してください。");await r.update({limitMs:ms,remainingMs:ms,startAt:null,pausedAt:null,pausedByLane:null})}
 else if(a==="delete"){if(confirm("削除しますか？"))await r.remove()}
}
async function advanceLane(){
 if(!(await canOperate()))return;
 const gs=laneGroups(),current=gs[0];if(current&&!current.finishedAt)return;
 const w=waiting()[0];if(!w)return;
 await groupsRef.child(w.id).update({kind:"group",stage:1,limitMs:600000,remainingMs:600000,startAt:null,pausedAt:null,finishedAt:null,createdAt:Date.now()});show("次のグループを案内しました");
}
async function addToLane(){
 const name=document.getElementById("name").value.trim();if(!name)return alert("グループ名を入力してください。");
 if(laneGroups().length>=2)return alert("このレーンは満員です。");
 if(!(await canOperate()))return;
 const id=groupsRef.push().key;await groupsRef.child(id).set({id,name,kind:"group",lane,stage:1,limitMs:600000,remainingMs:600000,startAt:null,pausedAt:null,finishedAt:null,createdAt:Date.now()});document.getElementById("name").value="";show("追加しました");
}
async function finishExpired(){
 const now=Date.now(),u={};
 groups.filter(g=>isGroup(g)&&g.lane===lane&&g.startAt&&!g.finishedAt).forEach(g=>{if(rem(g,now)<=0){u["groups/"+g.id+"/remainingMs"]=0;u["groups/"+g.id+"/startAt"]=null;u["groups/"+g.id+"/finishedAt"]=now;u["groups/"+g.id+"/finishedStage"]=Number(g.stage||1)}})
 if(Object.keys(u).length)await db.ref().update(u);
}
groupsRef.on("value",s=>{groups=normalize(s.val());document.getElementById("status").textContent="🟢 Firebase接続中　／　A・B共通データ";render()});
db.ref("control").on("value",s=>{control=normalizeControl(s.val());render()});
setInterval(()=>{finishExpired();render()},250);
</script>
</body>
</html>
