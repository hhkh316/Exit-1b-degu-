<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>状況モニター</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}
h1{margin:0;font-size:24px}.status,.card{background:#fff;border:1px solid #e0e5e9;border-radius:16px;padding:16px;margin:12px 0}.status{font-size:14px}
.control-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.control{border:1px solid #dce2e7;border-radius:14px;padding:14px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e9edf1;font-size:13px;font-weight:800}.on{background:#ffd9d6}.pause{background:#fff0bd}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;width:100%;margin-top:10px}.lock{background:#d93025;color:#fff}.unlock{background:#1769e0;color:#fff}.pausebtn{background:#f0b400;color:#17202a}.resumebtn{background:#1769e0;color:#fff}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lane{border:1px solid #dce2e7;border-radius:14px;padding:14px}.device{padding:9px 0;border-bottom:1px solid #edf0f2}.small{font-size:13px;color:#68737d}.ok{color:#18794e;font-weight:800}.err{color:#b42318;font-weight:800}
@media(max-width:700px){.control-grid,.lanes{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
 <h1>🖥️ 状況モニター</h1>
 <div class="status" id="status">Firebase接続中…</div>

 <section class="card">
  <h2>🔐 操作ロック</h2>
  <p class="small">ロック操作はこの状況モニターからのみ行えます。全体ロックはタイマーを止めず、操作だけを止めます。レーン休止はそのレーンの実行中タイマーを残り時間ごと一時停止します。</p>
  <div class="control-grid">
   <div class="control"><b>全体</b><p id="globalState" class="badge">確認中</p><button id="globalBtn" class="lock" onclick="toggleGlobal()">全体ロック</button></div>
   <div class="control"><b>レーンA</b><p id="stateA" class="badge">確認中</p><button id="btnA" class="pausebtn" onclick="toggleLane('A')">レーンA休止</button></div>
   <div class="control"><b>レーンB</b><p id="stateB" class="badge">確認中</p><button id="btnB" class="pausebtn" onclick="toggleLane('B')">レーンB休止</button></div>
  </div>
 </section>

 <section class="card">
  <h2>🎪 レーン状況</h2>
  <div class="lanes"><div class="lane" id="laneA"></div><div class="lane" id="laneB"></div></div>
 </section>

 <section class="card">
  <h2>📱 接続中の端末</h2>
  <div id="devices"></div>
 </section>

 <section class="card">
  <h2>🔥 Firebase</h2>
  <div id="firebaseInfo" class="small"></div>
 </section>

 <p class="small">※これは運営上の操作ロックです。Firebase自体のセキュリティルールを変更するものではありません。</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyDxGXjcovsjKm5S2a-KicwYfCxplDzngk",
 authDomain:"exit1b.firebaseapp.com",
 databaseURL:"https://exit1b-default-rtdb.firebaseio.com",
 projectId:"exit1b",
 storageBucket:"exit1b.firebasestorage.app",
 messagingSenderId:"165232048524",
 appId:"1:165232048524:web:9e9817e8a2cb95e05ffea9"
};
firebase.initializeApp(firebaseConfig);const db=firebase.database(),controlRef=db.ref("control"),groupsRef=db.ref("groups");
let control=normControl(null),groups=[];
function normControl(v){v=v||{};return{globalLocked:v.globalLocked===true,lanes:{A:{paused:v.lanes?.A?.paused===true},B:{paused:v.lanes?.B?.paused===true}}}}
function normGroups(v){if(!v)return[];if(Array.isArray(v))return v.filter(Boolean);return Object.entries(v).map(([id,g])=>({...g,id}))}
function isGroup(g){return g&&g.kind!=="waiting"&&g.name}
function limit(g){return Math.max(0,Number(g.limitMs||0))}
function rem(g,now=Date.now()){if(g.startAt)return Math.max(0,limit(g)-((now-g.startAt)+(g.elapsedBeforeStart||0)));return Math.max(0,Number(g.remainingMs??g.limitMs??0))}
function fmt(ms){ms=Math.max(0,Math.floor(ms/1000));return String(Math.floor(ms/60)).padStart(2,"0")+":"+String(ms%60).padStart(2,"0")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function laneGroups(l){return groups.filter(g=>isGroup(g)&&g.lane===l&&!g.finishedAt).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))}
function renderControl(){
 const gl=document.getElementById("globalState"),gb=document.getElementById("globalBtn");
 gl.textContent=control.globalLocked?"🔒 ロック中":"🔓 ロック解除";gl.className="badge "+(control.globalLocked?"on":"");
 gb.textContent=control.globalLocked?"🔓 全体ロック解除":"🔒 全体ロック";gb.className=control.globalLocked?"unlock":"lock";
 ["A","B"].forEach(l=>{const paused=control.lanes[l].paused,s=document.getElementById("state"+l),b=document.getElementById("btn"+l);s.textContent=paused?"⏸ 休止中":"▶ 通常";s.className="badge "+(paused?"pause":"");b.textContent=paused?"▶ レーン"+l+"再開":"⏸ レーン"+l+"休止";b.className=paused?"resumebtn":"pausebtn"});
}
async function toggleGlobal(){try{await controlRef.child("globalLocked").set(!control.globalLocked)}catch(e){alert("全体ロックの変更に失敗しました。")}}
async function toggleLane(lane){
 const next=!control.lanes[lane].paused;
 try{
  const fresh=normGroups((await groupsRef.once("value")).val()),now=Date.now(),updates={};
  if(next){
   fresh.filter(g=>isGroup(g)&&g.lane===lane&&g.startAt&&!g.finishedAt).forEach(g=>{
    const r=rem(g,now);
    if(r<=0){
     updates["groups/"+g.id+"/remainingMs"]=0;updates["groups/"+g.id+"/startAt"]=null;updates["groups/"+g.id+"/finishedAt"]=now;updates["groups/"+g.id+"/finishedStage"]=Number(g.stage||1);
    }else{
     updates["groups/"+g.id+"/remainingMs"]=r;updates["groups/"+g.id+"/startAt"]=null;updates["groups/"+g.id+"/pausedByLane"]=true;updates["groups/"+g.id+"/lanePausedAt"]=now;
    }
   });
  }else{
   fresh.filter(g=>isGroup(g)&&g.lane===lane&&g.pausedByLane===true).forEach(g=>{
    updates["groups/"+g.id+"/pausedByLane"]=null;updates["groups/"+g.id+"/lanePausedAt"]=null;updates["groups/"+g.id+"/resumedAt"]=now;
   });
  }
  updates["control/lanes/"+lane+"/paused"]=next;
  await db.ref().update(updates);
 }catch(e){alert("レーン"+lane+"の状態変更に失敗しました。")}
}
function renderLanes(){
 ["A","B"].forEach(l=>{
  const gs=laneGroups(l),e=document.getElementById("lane"+l);
  e.innerHTML=`<h3>レーン${l} <span class="badge ${control.lanes[l].paused?"pause":""}">${control.lanes[l].paused?"⏸ 休止中":"▶ 稼働中"}</span></h3>`+
   (gs.map(g=>`<div class="device"><b>${esc(g.name)}</b><br>ステージ ${Number(g.stage||1)} ／ ${fmt(rem(g))} ${g.startAt?"▶":g.pausedByLane?"⏸":""}</div>`).join("")||"<div class='small'>グループなし</div>");
 });
}
function renderDevices(v){
 const e=document.getElementById("devices"),arr=v||{};
 const rows=Object.entries(arr).sort((a,b)=>(b[1].updatedAt||0)-(a[1].updatedAt||0));
 e.innerHTML=rows.map(([id,x])=>`<div class="device"><b>${esc(x.page||"不明")}</b>　<span class="small">${new Date(x.updatedAt||Date.now()).toLocaleTimeString("ja-JP")}</span></div>`).join("")||"<div class='small'>接続中の端末はありません</div>";
}
controlRef.on("value",s=>{control=normControl(s.val());renderControl();renderLanes()});
groupsRef.on("value",s=>{groups=normGroups(s.val());document.getElementById("status").innerHTML="<span class='ok'>🟢 Firebase接続中</span>";renderLanes()});
db.ref("presence").on("value",s=>renderDevices(s.val()));
document.getElementById("firebaseInfo").textContent="projectId: "+firebaseConfig.projectId+" ／ database: exit1b-default-rtdb.firebaseio.com";
renderControl();
</script>
</body>
</html>
